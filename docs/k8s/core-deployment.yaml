        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REDIS_URL
        - name: HEDERA_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-account-id
        - name: HEDERA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-private-key
        - name: AI_MODERATION_ENABLED
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: AI_MODERATION_ENABLED
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
