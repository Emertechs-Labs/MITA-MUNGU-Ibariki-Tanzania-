# Kubernetes multi-document YAML manifest for Tanzania Platform
# This file contains multiple Kubernetes resources separated by ---
---
apiVersion: v1
kind: Namespace
metadata:
  name: tanzania-platform
  labels:
    name: tanzania-platform
    app: tanzania-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: tanzania-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  HEDERA_NETWORK: "mainnet"
  REDIS_URL: "redis://redis-service:6379"
  DATABASE_URL: "postgresql://platformadmin:password@postgres-service:5432/tanzaniaplatform"
  AI_MODERATION_ENABLED: "true"
  MULTILINGUAL_SUPPORT: "true"
  REGIONS: "dar-es-salaam,dodoma,mwanza,arusha"

---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: tanzania-platform
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  hedera-account-id: "SGVkZXJhQWNjb3VudElE"  # Replace with actual Hedera account ID
  hedera-private-key: "SGVkZXJhUHJpdmF0ZUtleQ=="  # Replace with actual private key
  hedera-topic-id: "SGVkZXJhVG9waWNJRA=="  # Replace with consensus topic ID
  database-password: "UGFzc3dvcmQ="  # Replace with actual DB password
  jwt-secret: "SldUU2VjcmV0"  # Replace with actual JWT secret
  encryption-key: "RW5jcnlwdGlvbktleQ=="  # Replace with actual encryption key
  singularitynet-key: "U2luZ3VsYXJpdHlOZXRLZXk="  # Replace with SingularityNET API key

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tanzania-platform
  labels:
    app: api-gateway
    component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
    spec:
      containers:
      - name: api-gateway
        image: tanzania-platform/api-gateway:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: NODE_ENV
        - name: HEDERA_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-account-id
        - name: HEDERA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-private-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-service
  namespace: tanzania-platform
  labels:
    app: voting-service
    component: voting
spec:
  replicas: 5
  selector:
    matchLabels:
      app: voting-service
  template:
    metadata:
      labels:
        app: voting-service
        component: voting
    spec:
      containers:
      - name: voting-service
        image: tanzania-platform/voting-service:v1.0.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: REDIS_URL
        - name: HEDERA_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-account-id
        - name: HEDERA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-private-key
        - name: HEDERA_TOPIC_ID
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-topic-id
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: encryption-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - voting-service
              topologyKey: kubernetes.io/hostname

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: tanzania-platform
  labels:
    app: identity-service
    component: identity
spec:
  replicas: 3
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        component: identity
    spec:
      containers:
      - name: identity-service
        image: tanzania-platform/identity-service:v1.0.0
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: DATABASE_URL
        - name: HEDERA_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-account-id
        - name: HEDERA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: hedera-private-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - identity-service
              topologyKey: kubernetes.io/hostname

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-moderation-service
  namespace: tanzania-platform
  labels:
    app: ai-moderation-service
    component: moderation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-moderation-service
  template:
    metadata:
      labels:
        app: ai-moderation-service
        component: moderation
    spec:
      nodeSelector:
        workload: ai
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "ai"
        effect: "NoSchedule"
      containers:
      - name: ai-moderation
        image: tanzania-platform/ai-moderation:v1.0.0
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: NODE_ENV
        - name: SINGULARITYNET_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: singularitynet-key
        - name: MULTILINGUAL_SUPPORT
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: MULTILINGUAL_SUPPORT
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ai-models-pvc
      - name: logs
        emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
