        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: DATABASE_URL
        - name: MULTILINGUAL_SUPPORT
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: MULTILINGUAL_SUPPORT
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
