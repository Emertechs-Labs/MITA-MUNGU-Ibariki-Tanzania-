  namespace: tanzania-platform
  labels:
    app: knowledge-service
    component: knowledge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-service
  template:
    metadata:
      labels:
        app: knowledge-service
        component: knowledge
    spec:
      containers:
      - name: knowledge-service
        image: tanzania-platform/knowledge-service:v1.0.0
        ports:
        - containerPort: 5001
