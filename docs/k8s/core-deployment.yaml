          mountPath: /app/logs
      volumes:
      - name: knowledge-base
        persistentVolumeClaim:
          claimName: knowledge-base-pvc
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: tanzania-platform
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: https
  selector:
    app: api-gateway

---
apiVersion: v1
kind: Service
metadata:
  name: voting-service
  namespace: tanzania-platform
  labels:
    app: voting-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: voting-service

---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: tanzania-platform
  labels:
    app: identity-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: identity-service

---
apiVersion: v1
kind: Service
metadata:
  name: ai-moderation-service
  namespace: tanzania-platform
  labels:
    app: ai-moderation-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: ai-moderation-service

---
apiVersion: v1
kind: Service
metadata:
  name: social-service
  namespace: tanzania-platform
  labels:
    app: social-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: social-service

---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-service
  namespace: tanzania-platform
  labels:
    app: knowledge-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5001
    protocol: TCP
    name: http
  selector:
    app: knowledge-service

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: tanzania-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.platform.tanzania.gov.tz
    secretName: platform-tls
  rules:
  - host: api.platform.tanzania.gov.tz
    http:
      paths:
      - path: /api/v1/voting
        pathType: Prefix
        backend:
          service:
            name: voting-service
            port:
              number: 80
      - path: /api/v1/identity
        pathType: Prefix
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /api/v1/social
        pathType: Prefix
        backend:
          service:
            name: social-service
            port:
              number: 80
      - path: /api/v1/knowledge
        pathType: Prefix
        backend:
          service:
            name: knowledge-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-service
            port:
              number: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-uploads-pvc
  namespace: tanzania-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: efs-sc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-base-pvc
  namespace: tanzania-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-models-pvc
  namespace: tanzania-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: gp3

